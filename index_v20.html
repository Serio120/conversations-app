<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversaciones con IA (v20)</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>
body{font-family:system-ui,sans-serif;background:#f5f5f5;margin:0;display:flex;box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}#sidebar{width:260px;background:#1e1e1e;color:#fff;padding:20px;height:100vh;overflow-y:auto;position:fixed;left:0;top:0}#sidebar h2{margin-top:0;font-size:1.2rem}.nav-item{background:#2d2d2d;padding:10px;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}.nav-title{flex:1;font-size:.9rem}.nav-buttons{display:flex;gap:4px}.nav-btn{background:#444;color:#fff;border:0;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:.75rem}.nav-btn:hover{background:#666}#main{margin-left:280px;padding:20px;width:calc(100% - 280px)}#topBar{position:fixed;top:0;left:280px;width:calc(100% - 280px);background:#fff;padding:10px;box-shadow:0 2px 6px #0002;z-index:1000;display:flex;gap:10px;align-items:center}.btn{background:#0078d4;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem}.btn:hover{background:#005ea0}.btn:disabled{opacity:.6;cursor:wait}#imgDropzone{background:#fafafa;border:2px dashed #bbb;padding:10px;border-radius:10px;text-align:center;color:#666;width:260px;height:80px;overflow-y:auto;font-size:.85rem}#imgDropzone img{max-width:120px;max-height:120px;margin-top:10px;border-radius:8px}.conversation,.history-item{background:#fff;border-radius:10px;padding:16px;margin-top:120px;margin-bottom:25px;box-shadow:0 2px 6px #00000014}textarea{width:100%;min-height:140px;font-family:monospace;font-size:.95rem;padding:8px;border-radius:6px;border:1px solid #ccc;resize:vertical;background:#fcfcfc}.question-box{background:#e8f1ff;border-left:5px solid #0078d4;padding:12px;border-radius:6px;margin-top:10px}.answer-box{background:#fff;border-left:5px solid #ffb100;padding:12px;border-radius:6px;margin-top:10px}.answer-box img{max-width:300px;max-height:300px;border-radius:8px;margin-top:10px;display:block}.edit-status{display:none;background:#fff3cd;border:1px solid #ffe69c;padding:8px;border-radius:6px;margin-top:10px;color:#664d03}@media print{#sidebar,#topBar{display:none}#main{margin-left:0;width:100%}}
</style></head><body>
<div id="sidebar"><h2>Conversaciones guardadas</h2><div id="nav"></div></div><div id="topBar"><div id="imgDropzone">Pega imágenes aquí (Ctrl+V)</div><button id="fixBtn" class="btn">Fijar imágenes</button><button id="saveBtn" class="btn">Guardar pregunta + respuesta</button><button id="cancelBtn" class="btn">Cancelar edición</button><button id="pdfBtn" class="btn">Exportar PDF</button></div><div id="main"><h1>Conversaciones con modelos de IA</h1><div id="editStatus" class="edit-status"></div><div class="conversation"><h2>Nueva interacción</h2><h3>Markdown del usuario</h3><textarea id="mdUser"></textarea><div id="renderUser" class="question-box"></div><h3>Markdown de la IA</h3><textarea id="mdIA"></textarea><div id="renderIA" class="answer-box"></div></div><div class="conversation"><h2>Historial de conversación</h2><div id="history"></div></div></div>
<script>
let conversations=[],editingId=null,pastedImages=[],sessionNewImages=[],editOriginalImages=[];const $=id=>document.getElementById(id);
function setupPasteListener(){if(window.__pasteHandler)return;window.__pasteHandler=e=>{if(!e.clipboardData)return;for(const item of e.clipboardData.items){if(!item.type.startsWith('image'))continue;const blob=item.getAsFile();if(!blob)continue;const reader=new FileReader();reader.onload=x=>{const src=x.target.result;const img=document.createElement('img');img.src=src;$('imgDropzone').appendChild(img);pastedImages.push(src)};reader.readAsDataURL(blob)}};document.addEventListener('paste',window.__pasteHandler)}
function renderMarkdown(inputId,outputId){const i=$(inputId),o=$(outputId);if(i&&o)o.innerHTML=marked.parse(i.value||'')}
function renderConversationImages(images){const p=$('renderIA');p.querySelectorAll('img').forEach(x=>x.remove());(images||[]).forEach(src=>{const img=document.createElement('img');img.src=src;p.appendChild(img)})}
function startEdit(id){const c=conversations.find(x=>x.id===id);if(!c)return;editingId=id;editOriginalImages=Array.isArray(c.images)?[...c.images]:[];pastedImages=[];sessionNewImages=[];$('mdUser').value=c.userMd||'';$('mdIA').value=c.aiMd||'';renderMarkdown('mdUser','renderUser');renderMarkdown('mdIA','renderIA');renderConversationImages(editOriginalImages);$('imgDropzone').textContent='Pega imágenes nuevas aquí (Ctrl+V)';$('editStatus').style.display='block';$('editStatus').textContent='Editando '+id.replace('conv_','Conversación ')+'. Modifica el texto o añade imágenes y pulsa Guardar.';$('saveBtn').textContent='Guardar cambios';window.scrollTo({top:0,behavior:'smooth'})}
function cancelEdit(){editingId=null;editOriginalImages=[];pastedImages=[];sessionNewImages=[];$('mdUser').value='';$('mdIA').value='';$('renderUser').innerHTML='';$('renderIA').innerHTML='';$('imgDropzone').textContent='Pega imágenes aquí (Ctrl+V)';$('editStatus').style.display='none';$('saveBtn').textContent='Guardar pregunta + respuesta'}
function imageToCompressedDataUrl(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const max=1800;let w=im.naturalWidth,h=im.naturalHeight;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=reject;im.src=src})}
async function fixImages(){if(!pastedImages.length){alert('No hay imágenes nuevas para fijar.');return}const btn=$('fixBtn');btn.disabled=true;try{const fixed=await Promise.all(pastedImages.map(imageToCompressedDataUrl));fixed.forEach(src=>{const img=document.createElement('img');img.src=src;$('renderIA').appendChild(img);sessionNewImages.push(src)});pastedImages=[];$('imgDropzone').textContent='Pega imágenes nuevas aquí (Ctrl+V)'}catch(e){console.error(e);alert('No se pudo procesar una de las imágenes.')}finally{btn.disabled=false}}
function nextConversationId(){let n=1,ids=new Set(conversations.map(c=>c.id));while(ids.has('conv_'+n))n++;return'conv_'+n}
function saveToLocalStorage(){try{localStorage.setItem('conversations',JSON.stringify(conversations));return true}catch(e){console.error('localStorage:',e);return false}}
function saveQA(){const u=$('mdUser').value.trim(),a=$('mdIA').value.trim();if(!u||!a){alert('Debes pegar la pregunta y la respuesta antes de guardar.');return}let ok;if(editingId!==null){const c=conversations.find(x=>x.id===editingId);if(!c){alert('La conversación en edición ya no existe.');cancelEdit();return}const old={...c,images:Array.isArray(c.images)?[...c.images]:[]};c.userMd=u;c.aiMd=a;c.images=[...editOriginalImages,...sessionNewImages];ok=saveToLocalStorage();if(!ok){Object.assign(c,old);alert('No se pudo guardar. El almacenamiento del navegador está lleno. La edición NO se ha cerrado ni perdido.');return}alert('Conversación actualizada.')}else{const c={id:nextConversationId(),userMd:u,aiMd:a,images:[...sessionNewImages]};conversations.push(c);ok=saveToLocalStorage();if(!ok){conversations.pop();alert('No se pudo guardar. El almacenamiento del navegador está lleno. La conversación NO se ha perdido.');return}alert('Guardado correctamente.')}cancelEdit();rebuildUI()}
function deleteConversation(id){if(!confirm('¿Seguro que quieres borrar esta conversación?'))return;const old=conversations;conversations=conversations.filter(c=>c.id!==id);if(!saveToLocalStorage()){conversations=old;alert('No se pudo borrar porque no se pudo guardar el cambio.');return}if(editingId===id)cancelEdit();rebuildUI()}
function loadFromLocalStorage(){const s=localStorage.getItem('conversations');if(!s)return;try{const d=JSON.parse(s);conversations=Array.isArray(d)?d:[];conversations.forEach(c=>{if(!Array.isArray(c.images))c.images=[]})}catch(e){console.error(e);alert('Los datos guardados están dañados y no se han podido cargar.')}}
function rebuildUI(){const h=$('history'),n=$('nav');h.innerHTML='';n.innerHTML='';conversations.forEach(c=>{const item=document.createElement('div');item.className='history-item';item.id=c.id;const q=document.createElement('div');q.className='question-box';q.innerHTML=marked.parse(c.userMd||'');const a=document.createElement('div');a.className='answer-box';a.innerHTML=marked.parse(c.aiMd||'');(c.images||[]).forEach(src=>{const img=document.createElement('img');img.src=src;a.appendChild(img)});const qh=document.createElement('h3');qh.textContent='Pregunta';const ah=document.createElement('h3');ah.textContent='Respuesta IA';item.append(qh,q,ah,a);h.appendChild(item);const ni=document.createElement('div');ni.className='nav-item';const t=document.createElement('span');t.className='nav-title';t.textContent=c.id.replace('conv_','Conversación ');const bs=document.createElement('div');bs.className='nav-buttons';const go=document.createElement('button');go.className='nav-btn';go.textContent='Ir';go.onclick=()=>$(c.id)?.scrollIntoView({behavior:'smooth'});const ed=document.createElement('button');ed.className='nav-btn';ed.textContent='Editar';ed.onclick=()=>startEdit(c.id);const del=document.createElement('button');del.className='nav-btn';del.textContent='Borrar';del.onclick=()=>deleteConversation(c.id);bs.append(go,ed,del);ni.append(t,bs);n.appendChild(ni)})}
$('mdUser').addEventListener('input',()=>renderMarkdown('mdUser','renderUser'));$('mdIA').addEventListener('input',()=>renderMarkdown('mdIA','renderIA'));$('fixBtn').addEventListener('click',fixImages);$('saveBtn').addEventListener('click',saveQA);$('cancelBtn').addEventListener('click',cancelEdit);$('pdfBtn').addEventListener('click',()=>window.print());window.addEventListener('load',()=>{loadFromLocalStorage();rebuildUI();setupPasteListener()});
</script></body></html>
