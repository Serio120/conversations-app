<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conversaciones con IA (v17)</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f5f5f5;margin:0;padding:0;display:flex;box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}
#sidebar{width:260px;background:#1e1e1e;color:white;padding:20px;height:100vh;overflow-y:auto;position:fixed;left:0;top:0}
#sidebar h2{margin-top:0;font-size:1.2rem;margin-bottom:15px}.nav-item{background:#2d2d2d;padding:10px;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}.nav-title{flex:1;font-size:.9rem}.nav-buttons{display:flex;gap:4px}.nav-btn{background:#444;color:white;border:none;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:.75rem}.nav-btn:hover{background:#666}
#main{margin-left:280px;padding:20px;width:calc(100% - 280px)}#topBar{position:fixed;top:0;left:280px;width:calc(100% - 280px);background:#fff;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:1000;display:flex;gap:10px;align-items:center}.btn{background:#0078d4;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.9rem}.btn:hover{background:#005ea0}
#imgDropzone{background:#fafafa;border:2px dashed #bbb;padding:10px;border-radius:10px;text-align:center;color:#666;width:260px;height:80px;overflow-y:auto;font-size:.85rem}#imgDropzone img{max-width:120px;max-height:120px;margin-top:10px;border-radius:8px}.conversation,.history-item{background:#fff;border-radius:10px;padding:16px;margin-top:120px;margin-bottom:25px;box-shadow:0 2px 6px rgba(0,0,0,.08)}textarea{width:100%;min-height:140px;font-family:monospace;font-size:.95rem;padding:8px;border-radius:6px;border:1px solid #ccc;resize:vertical;background:#fcfcfc}.question-box{background:#e8f1ff;border-left:5px solid #0078d4;padding:12px;border-radius:6px;margin-top:10px}.answer-box{background:#fff;border-left:5px solid #ffb100;padding:12px;border-radius:6px;margin-top:10px}.answer-box img{max-width:300px;max-height:300px;border-radius:8px;margin-top:10px}.edit-status{display:none;background:#fff3cd;border:1px solid #ffe69c;padding:8px;border-radius:6px;margin-top:10px;color:#664d03}@media print{#sidebar,#topBar{display:none}#main{margin-left:0;width:100%}}
</style></head>
<body>
<div id="sidebar"><h2>Conversaciones guardadas</h2><div id="nav"></div></div>
<div id="topBar"><div id="imgDropzone">Pega imágenes aquí (Ctrl+V)</div><button class="btn" onclick="fixImages()">Fijar imágenes</button><button class="btn" onclick="saveQA()">Guardar pregunta + respuesta</button><button class="btn" onclick="cancelEdit()">Cancelar edición</button><button class="btn" onclick="exportPDF()">Exportar PDF</button></div>
<div id="main"><h1>Conversaciones con modelos de IA</h1><div id="editStatus" class="edit-status"></div>
<div class="conversation"><h2>Nueva interacción</h2><h3>Markdown del usuario</h3><textarea id="mdUser" oninput="renderMarkdown('mdUser','renderUser')"></textarea><div id="renderUser" class="question-box"></div><h3>Markdown de la IA</h3><textarea id="mdIA" oninput="renderMarkdown('mdIA','renderIA')"></textarea><div id="renderIA" class="answer-box"></div></div>
<div class="conversation"><h2>Historial de conversación</h2><div id="history"></div></div></div>
<script>
let conversations=[];let editingId=null;let pastedImages=[];let editOriginalImages=[];
function setupPasteListener(){if(window.__pasteHandler)return;window.__pasteHandler=function(event){if(!event.clipboardData)return;for(const item of event.clipboardData.items){if(item.type.indexOf('image')===0){const blob=item.getAsFile();if(!blob)continue;const reader=new FileReader();reader.onload=function(e){const zone=document.getElementById('imgDropzone');if(!zone)return;const img=document.createElement('img');img.src=e.target.result;zone.appendChild(img);pastedImages.push(e.target.result)};reader.readAsDataURL(blob)}}};document.addEventListener('paste',window.__pasteHandler)}
function renderMarkdown(inputId,outputId){const el=document.getElementById(inputId),out=document.getElementById(outputId);if(el&&out)out.innerHTML=marked.parse(el.value)}
function renderConversationImages(images){const preview=document.getElementById('renderIA');preview.querySelectorAll('img').forEach(img=>img.remove());(images||[]).forEach(src=>{const img=document.createElement('img');img.src=src;preview.appendChild(img)})}
function fixImages(){if(!pastedImages.length){alert('No hay imágenes nuevas para fijar.');return}const preview=document.getElementById('renderIA');pastedImages.forEach(src=>{const img=document.createElement('img');img.src=src;preview.appendChild(img)});pastedImages=[];document.getElementById('imgDropzone').innerHTML='Pega imágenes aquí (Ctrl+V)'}
function editConversation(id){const conv=conversations.find(c=>c.id===id);if(!conv)return;editingId=id;editOriginalImages=[...(conv.images||[])];pastedImages=[];document.getElementById('mdUser').value=conv.userMd||'';document.getElementById('mdIA').value=conv.aiMd||'';renderMarkdown('mdUser','renderUser');renderMarkdown('mdIA','renderIA');renderConversationImages(editOriginalImages);document.getElementById('imgDropzone').innerHTML='Pega imágenes nuevas aquí (Ctrl+V)';const status=document.getElementById('editStatus');status.style.display='block';status.textContent='Editando '+id.replace('conv_','Conversación ')+'. Puedes modificar el texto y añadir imágenes nuevas.';window.scrollTo({top:0,behavior:'smooth'})}
function cancelEdit(){if(editingId===null)return;editingId=null;editOriginalImages=[];clearInputs()}
function saveQA(){const userMd=document.getElementById('mdUser').value.trim(),aiMd=document.getElementById('mdIA').value.trim();if(!userMd||!aiMd){alert('Debes pegar la pregunta y la respuesta antes de guardar.');return}const newImages=[...pastedImages];if(editingId!==null){const conv=conversations.find(c=>c.id===editingId);if(!conv){alert('No se encontró la conversación que estás editando.');return}conv.userMd=userMd;conv.aiMd=aiMd;conv.images=[...(editOriginalImages||[]),...newImages];alert('Conversación actualizada.')}else{const id=nextConversationId();conversations.push({id,userMd,aiMd,images:newImages});alert('Guardado correctamente.')}clearInputs();saveToLocalStorage();editingId=null;editOriginalImages=[];rebuildUI()}
function nextConversationId(){let n=1;const ids=new Set(conversations.map(c=>c.id));while(ids.has('conv_'+n))n++;return 'conv_'+n}
function deleteConversation(id){if(!confirm('¿Seguro que quieres borrar esta conversación?'))return;conversations=conversations.filter(c=>c.id!==id);if(editingId===id){editingId=null;editOriginalImages=[];clearInputs()}saveToLocalStorage();rebuildUI()}
function clearInputs(){document.getElementById('mdUser').value='';document.getElementById('mdIA').value='';document.getElementById('renderUser').innerHTML='';document.getElementById('renderIA').innerHTML='';pastedImages=[];document.getElementById('imgDropzone').innerHTML='Pega imágenes aquí (Ctrl+V)';document.getElementById('editStatus').style.display='none'}
function saveToLocalStorage(){try{localStorage.setItem('conversations',JSON.stringify(conversations))}catch(e){alert('No se pudieron guardar las conversaciones. El almacenamiento del navegador puede estar lleno.');console.error(e)}}
function loadFromLocalStorage(){const saved=localStorage.getItem('conversations');if(!saved)return;try{const data=JSON.parse(saved);conversations=Array.isArray(data)?data:[];conversations.forEach(c=>{if(!Array.isArray(c.images))c.images=[]})}catch(e){console.error('Error al cargar conversaciones:',e);alert('Los datos guardados están dañados y no se han podido cargar.')}}
function rebuildUI(){const history=document.getElementById('history'),nav=document.getElementById('nav');history.innerHTML='';nav.innerHTML='';conversations.forEach(conv=>{const item=document.createElement('div');item.className='history-item';item.id=conv.id;const q=document.createElement('div');q.className='question-box';q.innerHTML=marked.parse(conv.userMd||'');const a=document.createElement('div');a.className='answer-box';a.innerHTML=marked.parse(conv.aiMd||'');(conv.images||[]).forEach(src=>{const img=document.createElement('img');img.src=src;a.appendChild(img)});item.innerHTML='<h3>Pregunta</h3>';item.appendChild(q);item.insertAdjacentHTML('beforeend','<h3>Respuesta IA</h3>');item.appendChild(a);history.appendChild(item);const navItem=document.createElement('div');navItem.className='nav-item';const title=document.createElement('span');title.className='nav-title';title.innerText=conv.id.replace('conv_','Conversación ');const buttons=document.createElement('div');buttons.className='nav-buttons';const go=document.createElement('button');go.className='nav-btn';go.innerText='Ir';go.onclick=()=>document.getElementById(conv.id)?.scrollIntoView({behavior:'smooth'});const edit=document.createElement('button');edit.className='nav-btn';edit.innerText='Editar';edit.onclick=()=>editConversation(conv.id);const del=document.createElement('button');del.className='nav-btn';del.innerText='Borrar';del.onclick=()=>deleteConversation(conv.id);buttons.append(go,edit,del);navItem.append(title,buttons);nav.appendChild(navItem)})}
function exportPDF(){window.print()}window.onload=()=>{loadFromLocalStorage();rebuildUI();setupPasteListener()}
</script></body></html>
