<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversaciones con IA (v26.5)</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#app{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="index_v26_4.html" title="Conversaciones con IA"></iframe><script>
const frame=document.getElementById('app');
function patch(){
 const w=frame.contentWindow,d=frame.contentDocument;
 if(!w||!d||!w.selectedConversations||!w.renderPrintConversation)return;
 const old=d.getElementById('pdfGenerate');
 if(!old||old.dataset.v265)return;
 const btn=old.cloneNode(true);btn.dataset.v265='1';old.replaceWith(btn);
 btn.addEventListener('click',()=>generateSmartPdf(w,d,btn));
}
function makeSmartImageRows(doc){
 const blocks=[...doc.querySelectorAll('.print-conversation section')];
 blocks.forEach(section=>{
   const candidates=[...section.querySelectorAll('p')];
   candidates.forEach(p=>{
     const imgs=[...p.querySelectorAll('img')];
     if(!imgs.length)return;
     const text=(p.textContent||'').replace(/\s/g,'');
     if(text)return;
     p.classList.add('smart-image-row');
     p.querySelectorAll('.inline-image').forEach(w=>{w.style.margin='0';w.style.display='block';});
   });
 });
 requestAnimationFrame(()=>{
   doc.querySelectorAll('.smart-image-row').forEach(row=>{
     const imgs=[...row.querySelectorAll('img')];
     if(!imgs.length)return;
     row.style.display='flex';row.style.flexWrap='wrap';row.style.alignItems='flex-start';row.style.gap='10pt';row.style.margin='10pt 0';row.style.breakInside='avoid';row.style.pageBreakInside='avoid';
     imgs.forEach(img=>{img.style.maxWidth='300px';img.style.maxHeight='300px';img.style.width='auto';img.style.height='auto';img.style.objectFit='contain';});
     if(imgs.length>1){
       const gapPx=10*96/72;
       const available=Math.max(1,row.clientWidth-gapPx*(imgs.length-1));
       const naturalWidths=imgs.map(img=>Math.min(300,Math.max(1,img.getBoundingClientRect().width)));
       const total=naturalWidths.reduce((a,b)=>a+b,0);
       if(total>available){
         const scale=available/total;
         imgs.forEach((img,i)=>{img.style.width=Math.max(40,Math.floor(naturalWidths[i]*scale))+'px';img.style.maxWidth='none';});
       }
     }
   });
 });
}
async function generateSmartPdf(w,d,btn){
 const selected=w.selectedConversations();
 if(!selected.length){w.alert('Selecciona al menos una conversación.');return}
 btn.disabled=true;btn.textContent='Preparando impresión...';let win=null;
 try{
   win=w.open('about:blank','_blank');
   if(!win){w.alert('El navegador ha bloqueado la ventana de impresión. Permite ventanas emergentes para este servidor Python.');return}
   const pd=win.document;pd.open();
   pd.write('<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Historial de conversaciones</title><style>@page{size:A4;margin:12mm}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,sans-serif;line-height:1.5;font-size:12pt}.print-conversation{break-after:auto;page-break-after:auto}.print-conversation+.print-conversation{break-before:page;page-break-before:always}h1{font-size:22pt;margin:0 0 22pt;padding-bottom:8pt;border-bottom:1.5pt solid #ddd;break-after:avoid-page;page-break-after:avoid}h2,h3,h4,h5,h6{break-after:avoid-page;page-break-after:avoid}h2{font-size:15pt;margin:16pt 0 7pt}p,li,blockquote,pre,table{orphans:3;widows:3}img{max-width:100%;height:auto;max-height:300px;object-fit:contain;vertical-align:middle;break-inside:avoid;page-break-inside:avoid}.inline-image{display:inline-block;vertical-align:middle;margin:10pt 10pt 10pt 0;line-height:0;break-inside:avoid;page-break-inside:avoid}.inline-image img{max-width:300px;max-height:300px;border-radius:6px}.smart-image-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10pt;margin:10pt 0;break-inside:avoid;page-break-inside:avoid}.smart-image-row img{max-height:300px;width:auto;object-fit:contain}table{border-collapse:collapse;max-width:100%;break-inside:auto;page-break-inside:auto}thead{display:table-header-group}tr{break-inside:avoid;page-break-inside:avoid}td,th{border:1px solid #aaa;padding:4pt}pre{white-space:pre-wrap;overflow-wrap:anywhere;break-inside:avoid;page-break-inside:avoid}blockquote{margin-left:0;padding-left:12pt;border-left:3pt solid #aaa;break-inside:avoid;page-break-inside:avoid}ul,ol{padding-left:22pt}a{color:inherit;text-decoration:none}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body></body></html>');
   pd.close();
   const body=pd.body;selected.forEach(c=>body.appendChild(w.renderPrintConversation(c)));
   makeSmartImageRows(pd);
   const imgs=[...body.querySelectorAll('img')];
   await Promise.all(imgs.map(img=>{if(img.complete)return img.decode?img.decode().catch(()=>{}):Promise.resolve();return new Promise(r=>{const done=()=>r();img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true})}).then(()=>img.decode?img.decode().catch(()=>{}):undefined)}));
   await new Promise(r=>setTimeout(r,150));win.focus();win.print();win.addEventListener('afterprint',()=>{try{win.close()}catch(e){}},{once:true});
   d.getElementById('pdfModal').style.display='none';
 }catch(e){console.error(e);if(win)try{win.close()}catch(_){}w.alert('No se pudo preparar la impresión.')}finally{btn.disabled=false;btn.textContent='Imprimir / Guardar PDF'}
}
frame.addEventListener('load',()=>{setTimeout(patch,50)});
</script></body></html>
