<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversaciones con IA (v5 con Navegador + Estilos)</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* SIDEBAR */
        #sidebar {
            width: 260px;
            background: #1e1e1e;
            color: white;
            padding: 20px;
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
        }

        #sidebar h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .nav-item {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .nav-item:hover {
            background: #3a3a3a;
        }

        /* MAIN CONTENT */
        #main {
            margin-left: 280px;
            padding: 20px;
            width: calc(100% - 280px);
        }

        .conversation, .history-item {
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        textarea {
            width: 100%;
            min-height: 140px;
            font-family: monospace;
            font-size: 0.95rem;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: vertical;
            background: #fcfcfc;
        }

        /* PREGUNTA DESTACADA */
        .question-box {
            background: #e8f1ff;
            border-left: 5px solid #0078d4;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        /* RESPUESTA */
        .answer-box {
            background: #fff;
            border-left: 5px solid #ffb100;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .btn {
            background: #0078d4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #005ea0;
        }

        @media print {
            #sidebar {
                display: none;
            }
            #main {
                margin-left: 0;
                width: 100%;
            }
            .btn {
                display: none;
            }
        }
    </style>

    <script>
        let counter = 1;

        function renderMarkdown(inputId, outputId) {
            const md = document.getElementById(inputId).value;
            document.getElementById(outputId).innerHTML = marked.parse(md);
        }

        function saveQA(userMdId, aiMdId, historyId) {
            const userMd = document.getElementById(userMdId).value.trim();
            const aiMd = document.getElementById(aiMdId).value.trim();

            if (!userMd || !aiMd) {
                alert("Debes pegar la pregunta y la respuesta antes de guardar.");
                return;
            }

            const history = document.getElementById(historyId);

            const itemId = "conv_" + counter;

            const item = document.createElement("div");
            item.className = "history-item";
            item.id = itemId;

            item.innerHTML = `
                <h3>Pregunta</h3>
                <div class="question-box">${marked.parse(userMd)}</div>

                <h3>Respuesta IA</h3>
                <div class="answer-box">${marked.parse(aiMd)}</div>
            `;

            history.appendChild(item);

            // Añadir al navegador lateral
            const nav = document.getElementById("nav");
            const navItem = document.createElement("div");
            navItem.className = "nav-item";
            navItem.innerText = "Conversación " + counter;
            navItem.onclick = () => {
                document.getElementById(itemId).scrollIntoView({ behavior: "smooth" });
            };
            nav.appendChild(navItem);

            counter++;

            // Limpiar campos
            document.getElementById(userMdId).value = "";
            document.getElementById(aiMdId).value = "";
            document.getElementById("renderUser").innerHTML = "";
            document.getElementById("renderIA").innerHTML = "";

            alert("Guardado correctamente.");
        }
    </script>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <h2>Conversaciones guardadas</h2>
    <div id="nav"></div>
</div>

<!-- MAIN CONTENT -->
<div id="main">

    <h1>Conversaciones con modelos de IA</h1>

    <!-- BLOQUE PRINCIPAL -->
    <div class="conversation">
        <h2>Nueva interacción</h2>

        <h3>Markdown del usuario</h3>
        <textarea id="mdUser" oninput="renderMarkdown('mdUser','renderUser')"></textarea>
        <div id="renderUser" class="question-box"></div>

        <h3>Markdown de la IA</h3>
        <textarea id="mdIA" oninput="renderMarkdown('mdIA','renderIA')"></textarea>
        <div id="renderIA" class="answer-box"></div>

        <button class="btn" onclick="saveQA('mdUser','mdIA','history')">Guardar pregunta + respuesta</button>
    </div>

    <!-- HISTORIAL -->
    <div class="conversation">
        <h2>Historial de conversación</h2>
        <div id="history"></div>
    </div>

</div>

</body>
</html>
