<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversaciones con IA (v11 edición limpia + nav + imágenes 400x400)</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* SIDEBAR */
        #sidebar {
            width: 260px;
            background: #1e1e1e;
            color: white;
            padding: 20px;
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
        }

        #sidebar h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .nav-item {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .nav-title {
            flex: 1;
            font-size: 0.9rem;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
        }

        .nav-btn {
            background: #444;
            color: white;
            border: none;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .nav-btn:hover {
            background: #666;
        }

        /* MAIN CONTENT */
        #main {
            margin-left: 280px;
            padding: 20px;
            width: calc(100% - 280px);
        }

        /* TOP FIXED BAR */
        #topBar {
            position: fixed;
            top: 0;
            left: 280px;
            width: calc(100% - 280px);
            background: #ffffff;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: #0078d4;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: #005ea0;
        }

        /* FIXED IMAGE DROPZONE */
        #imgDropzone {
            background: #fafafa;
            border: 2px dashed #bbb;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            color: #666;
            width: 260px;
            height: 80px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        #imgDropzone img {
            max-width: 120px;
            max-height: 120px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .conversation, .history-item {
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            margin-top: 120px;
            margin-bottom: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        textarea {
            width: 100%;
            min-height: 140px;
            font-family: monospace;
            font-size: 0.95rem;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: vertical;
            background: #fcfcfc;
        }

        .question-box {
            background: #e8f1ff;
            border-left: 5px solid #0078d4;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .answer-box {
            background: #fff;
            border-left: 5px solid #ffb100;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .answer-box img {
            max-width: 400px;
            max-height: 400px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media print {
            #sidebar, #topBar {
                display: none;
            }
            #main {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>

    <script>
        let counter = 1;
        let pastedImages = [];

        function renderMarkdown(inputId, outputId) {
            const md = document.getElementById(inputId).value;
            document.getElementById(outputId).innerHTML = marked.parse(md);
        }

        /* PEGAR IMÁGENES DESDE PORTAPAPELES */
        document.addEventListener("paste", function (event) {
            const items = event.clipboardData.items;

            for (const item of items) {
                if (item.type.indexOf("image") === 0) {
                    const blob = item.getAsFile();
                    const reader = new FileReader();

                    reader.onload = function (e) {
                        const img = document.createElement("img");
                        img.src = e.target.result;
                        document.getElementById("imgDropzone").appendChild(img);
                        pastedImages.push(e.target.result);
                    };

                    reader.readAsDataURL(blob);
                }
            }
        });

        function fixImages() {
            const preview = document.getElementById("renderIA");

            pastedImages.forEach(src => {
                const img = document.createElement("img");
                img.src = src;
                preview.appendChild(img);
            });

            pastedImages = [];
            document.getElementById("imgDropzone").innerHTML = "Pega imágenes aquí (Ctrl+V)";
        }

        function saveQA(userMdId, aiMdId, historyId) {
            const userMd = document.getElementById(userMdId).value.trim();
            const aiMd = document.getElementById(aiMdId).value.trim();

            if (!userMd || !aiMd) {
                alert("Debes pegar la pregunta y la respuesta antes de guardar.");
                return;
            }

            const history = document.getElementById(historyId);
            const itemId = "conv_" + counter;

            const item = document.createElement("div");
            item.className = "history-item";
            item.id = itemId;

            // Guardamos el markdown bruto en data-attributes
            item.dataset.userMd = userMd;
            item.dataset.aiMd = aiMd;

            item.innerHTML = `
                <h3>Pregunta</h3>
                <div class="question-box">${marked.parse(userMd)}</div>

                <h3>Respuesta IA</h3>
                <div class="answer-box">${marked.parse(aiMd)}</div>
            `;

            history.appendChild(item);

            // Insertar imágenes pegadas en la respuesta guardada
            const answerBox = item.querySelector(".answer-box");
            const previewImages = document.querySelectorAll("#renderIA img");

            previewImages.forEach(img => {
                const clone = img.cloneNode(true);
                clone.style.maxWidth = "400px";
                clone.style.maxHeight = "400px";
                answerBox.appendChild(clone);
            });

            // Navegador lateral con botones
            const nav = document.getElementById("nav");
            const navItem = document.createElement("div");
            navItem.className = "nav-item";

            const titleSpan = document.createElement("span");
            titleSpan.className = "nav-title";
            titleSpan.innerText = "Conversación " + counter;

            const btnContainer = document.createElement("div");
            btnContainer.className = "nav-buttons";

            const goBtn = document.createElement("button");
            goBtn.className = "nav-btn";
            goBtn.innerText = "Ir";
            goBtn.onclick = () => {
                document.getElementById(itemId).scrollIntoView({ behavior: "smooth" });
            };

            const editBtn = document.createElement("button");
            editBtn.className = "nav-btn";
            editBtn.innerText = "Editar";
            editBtn.onclick = () => {
                editConversation(itemId);
            };

            btnContainer.appendChild(goBtn);
            btnContainer.appendChild(editBtn);

            navItem.appendChild(titleSpan);
            navItem.appendChild(btnContainer);
            nav.appendChild(navItem);

            counter++;

            // Limpiar campos
            document.getElementById(userMdId).value = "";
            document.getElementById(aiMdId).value = "";
            document.getElementById("renderUser").innerHTML = "";
            document.getElementById("renderIA").innerHTML = "";
            pastedImages = [];
            document.getElementById("imgDropzone").innerHTML = "Pega imágenes aquí (Ctrl+V)";

            alert("Guardado correctamente.");
        }

        function editConversation(id) {
            const item = document.getElementById(id);

            const userMd = item.dataset.userMd || "";
            const aiMd = item.dataset.aiMd || "";

            document.getElementById("mdUser").value = userMd;
            document.getElementById("mdIA").value = aiMd;

            renderMarkdown("mdUser", "renderUser");
            renderMarkdown("mdIA", "renderIA");

            document.getElementById("mdUser").scrollIntoView({ behavior: "smooth" });
        }

        function exportPDF() {
            window.print();
        }
    </script>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <h2>Conversaciones guardadas</h2>
    <div id="nav"></div>
</div>

<!-- TOP FIXED BAR -->
<div id="topBar">
    <div id="imgDropzone">Pega imágenes aquí (Ctrl+V)</div>
    <button class="btn" onclick="fixImages()">Fijar imágenes</button>
    <button class="btn" onclick="saveQA('mdUser','mdIA','history')">Guardar pregunta + respuesta</button>
    <button class="btn" onclick="exportPDF()">Exportar PDF</button>
</div>

<!-- MAIN CONTENT -->
<div id="main">

    <h1>Conversaciones con modelos de IA</h1>

    <!-- BLOQUE PRINCIPAL -->
    <div class="conversation">
        <h2>Nueva interacción</h2>

        <h3>Markdown del usuario</h3>
        <textarea id="mdUser" oninput="renderMarkdown('mdUser','renderUser')"></textarea>
        <div id="renderUser" class="question-box"></div>

        <h3>Markdown de la IA</h3>
        <textarea id="mdIA" oninput="renderMarkdown('mdIA','renderIA')"></textarea>
        <div id="renderIA" class="answer-box"></div>
    </div>

    <!-- HISTORIAL -->
    <div class="conversation">
        <h2>Historial de conversación</h2>
        <div id="history"></div>
    </div>

</div>

</body>
</html>
